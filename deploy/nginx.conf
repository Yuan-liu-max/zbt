# 珠宝通生产环境 Nginx 配置模板
# 使用说明：将 your-domain.com 替换为实际域名，并配置 SSL 证书路径后放入
# /etc/nginx/conf.d/ 或 sites-enabled/ 下，然后 nginx -s reload。

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # 上传大小限制（与后端 spring.servlet.multipart.max-file-size 保持一致）
    client_max_body_size 50m;

    # SSL 证书（按实际路径配置）
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 管理端静态托管
    location /admin/ {
        alias /var/www/frontend/dist/;
        try_files $uri $uri/ /admin/index.html;
    }
    # 商城静态托管
    location /h5/ {
        alias /var/www/shop/dist/;
        try_files $uri $uri/ /h5/index.html;
    }
    # 后端 API 反代（注意后端 context-path 是 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /files/ {
        proxy_pass http://127.0.0.1:8080/api/files/;
    }
    location /images/ {
        proxy_pass http://127.0.0.1:8080/api/images/;
    }
}
