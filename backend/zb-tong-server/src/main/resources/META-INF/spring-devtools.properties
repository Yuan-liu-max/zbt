# Spring Boot DevTools 热更新配置
# 当检测到 classpath 中文件变化时自动触发应用重启

# 启用 restart classloader
restart.enabled=true

# 自定义监控路径
restart.additional-paths=src/main/java

# 排除不触发重启的路径
restart.exclude=static/**,public/**,META-INF/**

# LiveReload（前后端分离项目不需要，已关闭）
livereload.enabled=false

# 远程调试端口（如需远程热更新可开启）
# remote.secret=dev-secret
