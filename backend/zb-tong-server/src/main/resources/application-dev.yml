# 开发环境配置 — 含所有敏感字段默认值，仅用于本地开发
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zb_tong_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}

# JWT 密钥 (dev 默认)
jwt:
  secret: ${JWT_SECRET:ZbtProject2026SecretKeyForJwtTokenGenerationAndValidation32Bytes}

# MinIO 存储 (dev 默认)
file:
  storage:
    minio:
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}

# XXL-JOB (dev 默认)
xxl:
  job:
    accessToken: ${XXL_ACCESS_TOKEN:default_token}

# AI (dev 默认)
ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-your-key}

logging:
  level:
    root: INFO
    com.zhubao.manage: DEBUG
    org.springframework.security: DEBUG
