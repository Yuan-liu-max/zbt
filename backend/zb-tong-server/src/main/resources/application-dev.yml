# 开发环境配置 — 含所有敏感字段默认值，仅用于本地开发
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  flyway:
    enabled: false  # dev: skip Flyway (DB schema already exists, V30残留记录)

  datasource:
    url: jdbc:mysql://localhost:3306/zb_tong_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}

# JWT 密钥 (dev 默认)
jwt:
  secret: ${JWT_SECRET:ZbtProject2026SecretKeyForJwtTokenGenerationAndValidation32Bytes}

# MinIO 存储 (dev 默认)
file:
  storage:
    type: local
    local:
      path: ${user.dir}/data/files
    minio:
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}

# XXL-JOB (dev 默认)
xxl:
  job:
    accessToken: ${XXL_ACCESS_TOKEN:default_token}

# AI (dev 默认)
ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-your-key}

# 高德地图 Key（dev 默认：本地定位测试）
amap:
  key: ${AMAP_KEY:171aef518e6804f9732b2591479bbf5a}

  # DevTools 热更新配置
  devtools:
    restart:
      enabled: true                    # 开启自动重启
      additional-paths: src/main/java  # 额外监控的源码路径
      trigger-file: target/classes/.restart   # 触发文件：touch 此文件即可强制热重启（兼容 Windows）
      exclude:                         # 不触发重启的目录
        - static/**
        - public/**
        - META-INF/**
    livereload:
      enabled: false                   # 前后端分离项目关闭前端 LiveReload

logging:
  level:
    root: INFO
    com.zhubao.manage: DEBUG
    org.springframework.security: DEBUG
