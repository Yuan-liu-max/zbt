server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: zb-tong-server

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zb_tong?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: utf-8

  # 文件上传
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # Jackson序列化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhubao.manage
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # table-prefix 不设全局值，各实体通过 @TableName 显式声明
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# JWT配置
jwt:
  secret: ${JWT_SECRET:ZbtProject2026SecretKeyForJwtTokenGenerationAndValidation32Bytes}
  expiration: 7200000
  header: Authorization
  token-prefix: "Bearer "

# 文件存储配置
file:
  storage:
    type: minio
    pre-url-expiry: 600
    minio:
      endpoint: http://localhost:9000
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: zbtong

# XXL-JOB 配置
xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    accessToken: ${XXL_ACCESS_TOKEN:default_token}
    executor:
      appname: zb-tong-executor
      address:
      ip:
      port: 9999
      logpath: logs/xxl-job
      logretentiondays: 30

# AI配置
ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-your-key}
    model: gpt-4
    timeout: 120

# 日志配置
logging:
  level:
    root: INFO
    com.zhubao.manage: DEBUG
