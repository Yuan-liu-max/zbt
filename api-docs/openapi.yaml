openapi: "3.0.3"
info:
  title: 珠宝通 ERP API
  description: |
    珠宝通零售连锁门店主动式管理系统 — 前后端共用接口文档。

    ## 使用说明
    - **后端**：以此文档为契约，确保 Controller 实现与文档一致
    - **前端**：以此文档为参考，编写 API 调用代码；也可用 openapi-generator 自动生成 TypeScript 客户端

    ## 认证
    除登录/注册外，所有接口需在请求头携带 JWT Token：
    ```
    Authorization: Bearer <token>
    ```

    ## 统一响应格式
    - 成功：`{ "code": 200, "msg": "success", "data": {...} }`
    - 失败：`{ "code": 500, "msg": "错误描述" }`
    - 参数错误：`{ "code": 400, "msg": "参数错误描述" }`
    - 未登录：`{ "code": 401, "msg": "请先登录" }`
    - 无权限：`{ "code": 403, "msg": "权限不足" }`

    ## 分页规范
    - 请求：`{ "page": 1, "pageSize": 20 }`（Query 参数）
    - 响应：`{ "list": [...], "total": 100, "page": 1, "size": 20 }`
  version: "1.0.0"
  contact:
    name: 珠宝通开发团队

servers:
  - url: http://localhost:8080/api
    description: 本地开发环境

tags:
  - name: 认证
    description: 登录、注册、用户信息
  - name: 商品
    description: 商品档案 CRUD、分类、品牌、库存
  - name: 订单
    description: 订单 CRUD、退换货
  - name: 文件
    description: 文件上传

# ============================================================
# 通用 Schema
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---- 通用响应包裹 ----
    ApiResult:
      type: object
      properties:
        code:
          type: integer
          description: 状态码，200=成功
          example: 200
        msg:
          type: string
          description: 消息
          example: success
        data:
          description: 响应数据（类型视具体接口而定）

    # ---- 分页 ----
    PageResult_ProductVO:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProductVO'
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20

    PageResult_OrderVO:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/OrderVO'
        total:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20

    PageResult_OrderReturn:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturn'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ---- 认证 ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 用户名
          example: "admin"
        password:
          type: string
          format: password
          description: 密码
          example: "123456"

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          format: password
          description: 密码
        phone:
          type: string
          description: 手机号

    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: JWT Token
        userId:
          type: integer
          format: int64
        username:
          type: string
        realName:
          type: string
          description: 真实姓名
        avatar:
          type: string
          description: 头像 URL
        phone:
          type: string
        email:
          type: string
        storeId:
          type: integer
          format: int64
        storeName:
          type: string
          description: 所属门店名称
        roles:
          type: array
          items:
            type: string
          description: 角色编码列表
        roleNames:
          type: array
          items:
            type: string
          description: 角色名称列表
        permissions:
          type: array
          items:
            type: string
          description: 权限编码列表

    ProfileUpdateRequest:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        avatar:
          type: string
        timezone:
          type: string
        language:
          type: string
        dateFormat:
          type: string
        notifySystem:
          type: boolean
        notifyOrder:
          type: boolean
        notifyInventory:
          type: boolean
        notifyMarketing:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    # ---- 商品 ----
    ProductVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: 商品编码
        name:
          type: string
          description: 商品名称
        categoryId:
          type: string
          description: 分类标识
        categoryName:
          type: string
          description: 分类名称
        brandId:
          type: string
          description: 品牌标识
        brandName:
          type: string
          description: 品牌名称
        price:
          type: number
          description: 零售价
        costPrice:
          type: number
          description: 成本价
        stock:
          type: integer
          description: 库存数量
        storeId:
          type: integer
          format: int64
          description: 所属门店ID
        storeName:
          type: string
          description: 所属门店名称
        status:
          type: string
          description: 状态：on=上架, off=下架
          enum: [on, off]
        imageUrl:
          type: string
          description: 商品主图
        description:
          type: string
          description: 商品描述/寓意
        material:
          type: string
          description: 材质
        weight:
          type: string
          description: 重量
        size:
          type: string
          description: 尺寸
        color:
          type: string
          description: 颜色
        shape:
          type: string
          description: 形状
        meaning:
          type: string
          description: 寓意
        createdAt:
          type: string
          description: 创建时间 (yyyy-MM-dd HH:mm:ss)
        updatedAt:
          type: string
          description: 更新时间

    ProductCreateRequest:
      type: object
      required: [name]
      properties:
        code:
          type: string
          description: 商品编码（为空自动生成）
        name:
          type: string
          description: 商品名称
        categoryName:
          type: string
          description: 分类名称
        brandName:
          type: string
          description: 品牌/款式
        price:
          type: number
          description: 零售价
        material:
          type: string
        weight:
          type: string
        size:
          type: string
        color:
          type: string
        shape:
          type: string
        meaning:
          type: string
          description: 寓意/描述
        status:
          type: string
          enum: [on, off]
          default: "on"
        storeId:
          type: integer
          format: int64
        stock:
          type: integer

    CategoryItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    BrandItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    StockAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: 调整数量（正=入库，负=出库）

    TransferRequest:
      type: object
      required: [productId, toStoreId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        toStoreId:
          type: integer
          format: int64
          description: 目标门店ID
        quantity:
          type: integer
          description: 调拨数量

    # ---- 订单 ----
    OrderCreateRequest:
      type: object
      properties:
        orderCode:
          type: string
          description: 订单编号（为空自动生成）
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: string
        totalAmount:
          type: number
          description: 商品总金额
        freight:
          type: number
          description: 运费
        couponDiscount:
          type: number
          description: 优惠金额
        orderAmount:
          type: number
          description: 实付金额
        orderStatus:
          type: string
          description: 订单状态
        paymentStatus:
          type: string
          description: 支付状态
        paymentMethod:
          type: string
          description: 支付方式
        deliveryMethod:
          type: string
          description: 配送方式
        remark:
          type: string
          description: 备注

    OrderVO:
      type: object
      properties:
        id:
          type: string
        orderCode:
          type: string
          description: 订单编号
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemVO'
        totalAmount:
          type: number
        freight:
          type: number
        couponDiscount:
          type: number
        orderAmount:
          type: number
        orderStatus:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        deliveryMethod:
          type: string
        remark:
          type: string
        createdAt:
          type: string
        logs:
          type: array
          items:
            $ref: '#/components/schemas/OrderLogVO'

    OrderItemVO:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productCode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number

    OrderLogVO:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
          description: 操作类型
        operator:
          type: string
          description: 操作人
        remark:
          type: string
        createdAt:
          type: string

    OrderReturn:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        orderCode:
          type: string
        returnCode:
          type: string
        returnType:
          type: string
          description: 退换货类型
        reason:
          type: string
        status:
          type: string
        refundAmount:
          type: number
        createdAt:
          type: string

    # ---- 文件 ----
    FileResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
        originalName:
          type: string
          description: 原始文件名
        storedName:
          type: string
          description: 存储文件名
        url:
          type: string
          description: 文件访问 URL
        size:
          type: integer
          format: int64
          description: 文件大小（字节）
        contentType:
          type: string
        createdAt:
          type: string

    PresignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          description: 预签名上传 URL
        fileUrl:
          type: string
          description: 上传后的访问 URL

security:
  - BearerAuth: []

# ============================================================
# API 路径
# ============================================================
paths:
  # ==================== 认证模块 ====================
  /auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /auth/register:
    post:
      tags: [认证]
      summary: 用户注册（默认导购角色）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功，直接返回登录信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /auth/me:
    get:
      tags: [认证]
      summary: 获取当前登录用户信息
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /auth/logout:
    post:
      tags: [认证]
      summary: 用户登出
      responses:
        '200':
          description: 登出成功

  /auth/profile:
    put:
      tags: [认证]
      summary: 更新个人信息
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 更新成功

  /auth/password:
    put:
      tags: [认证]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功

  /auth/stats:
    get:
      tags: [认证]
      summary: 用户统计
      responses:
        '200':
          description: 统计数据

  # ==================== 商品模块 ====================
  /products:
    get:
      tags: [商品]
      summary: 商品列表（分页 + 筛选）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索关键词（匹配商品名称/编码）
        - name: categoryId
          in: query
          schema:
            type: string
          description: 分类筛选
        - name: status
          in: query
          schema:
            type: string
            enum: [on, off]
          description: 状态筛选：on=上架, off=下架
        - name: storeId
          in: query
          schema:
            type: integer
            format: int64
          description: 门店筛选
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResult_ProductVO'
    post:
      tags: [商品]
      summary: 新增商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: 创建成功，返回完整商品信息

  /products/{id}:
    get:
      tags: [商品]
      summary: 商品详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 商品详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductVO'
    put:
      tags: [商品]
      summary: 更新商品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [商品]
      summary: 删除商品（逻辑删除）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功

  /products/categories:
    get:
      tags: [商品]
      summary: 分类列表
      responses:
        '200':
          description: 分类列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryItem'

  /products/brands:
    get:
      tags: [商品]
      summary: 品牌分页列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: name
          in: query
          schema:
            type: string
          description: 品牌名搜索
      responses:
        '200':
          description: 品牌列表

  /products/brands/all:
    get:
      tags: [商品]
      summary: 全部品牌（简表）
      responses:
        '200':
          description: 全部品牌
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BrandItem'

  /products/{id}/adjust-stock:
    put:
      tags: [商品]
      summary: 库存调整
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
      responses:
        '200':
          description: 调整成功

  /products/transfer:
    post:
      tags: [商品]
      summary: 商品调拨
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: 调拨成功

  # ==================== 订单模块 ====================
  /orders:
    get:
      tags: [订单]
      summary: 订单分页列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索关键词
        - name: status
          in: query
          schema:
            type: string
          description: 订单状态筛选
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResult_OrderVO'
    post:
      tags: [订单]
      summary: 创建订单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 创建成功

  /orders/{id}:
    get:
      tags: [订单]
      summary: 订单详情（含商品明细 + 操作日志）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderVO'
    put:
      tags: [订单]
      summary: 更新订单
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [订单]
      summary: 删除订单
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功

  /orders/{id}/cancel:
    put:
      tags: [订单]
      summary: 取消订单
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 取消成功

  /orders/returns:
    get:
      tags: [订单]
      summary: 退换货分页列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 退换货列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResult_OrderReturn'
    post:
      tags: [订单]
      summary: 创建退换货申请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReturn'
      responses:
        '200':
          description: 创建成功

  /orders/returns/{id}:
    get:
      tags: [订单]
      summary: 退换货详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 退换货详情

  /orders/returns/{id}/cancel:
    put:
      tags: [订单]
      summary: 撤销退换货申请
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 撤销成功

  # ==================== 文件模块 ====================
  /files/upload:
    post:
      tags: [文件]
      summary: 单文件上传
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传文件
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FileResource'

  /files/upload-batch:
    post:
      tags: [文件]
      summary: 批量上传
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 文件列表
      responses:
        '200':
          description: 上传成功

  /files/presigned-url:
    get:
      tags: [文件]
      summary: 生成预签名上传 URL（移动端直传）
      parameters:
        - name: fileName
          in: query
          required: true
          schema:
            type: string
          description: 原始文件名
      responses:
        '200':
          description: 预签名 URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PresignedUrlResponse'

  /files/{id}:
    delete:
      tags: [文件]
      summary: 删除文件（逻辑删除）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 删除成功
